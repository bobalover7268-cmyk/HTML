<!DOCTYPE html>
<html>
<head>
    <title>My Superhero Card</title>
    <style>

        /* Typography - font, size, weight, color for the whole page */
        body {
            background-color: lightskyblue
            color:white;
            font-family: Arial, sans-serif;
        }

        /* Typography+ Text Shadow - bigbold title with a blue shadow */
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: lightblue
            text-shado: 3px 3px turquoise;
        }

        /* Typography + Text Transform -  tagline becomes Title Case */
        .tagline {
            font-style: italic;
            color:lightyellow
            text-transform: capatilize;
        }

        /* Text Transform + Text Decoration - section headings in CAPS ith underline */
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: lightgoldenrodyellow;
        }

        /* Typography - powers stand out in bold yellow */
        .power {
             font-weight: bold;
             color: light palegoldenrod
        }

        /* Text Decoration - eakness are crossed out*/
        .weakness {
            text-decoration: line-through;
            color: rgb(253, 181, 181);
                   
        }
        /* Transform - the badge is tilted to the side */
        .badge {
            font-size: 28px;
            font-weight:bold;
            color: goldenrod;
            transform: rotate(15deg);
        }

        /* Typography - footer text */
        .made-by {
            color: palevioletred;
            font-style: italic;
        }
    </style>
</head>
<body>
    
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline"> the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness"> Maths homework</p>
    <p class="weakness">Broccoli</p>

     <p class="badge">Top Hero</p>

      <p class="made-by">Created by Arni</p>
</body>
</html>
