<!DOCTYPE html >
<html>
<head>
    <title>My Animal Fact File</title>
    <style>

        body {
            background-color: green;
            font-family: Arial, sans-serif;
        }

        .fact-file {
            background-color: lightgreen;
            color: palegreen;
            width: 260;
            padding: 260px;
            border: 4px solid greenyellow;
            margin: 30px;
        }

        .animal-name {
            color: forestgreen;
            font-size: 22px;
        }

        .detail {
            color: darkslategray;
        }

        .cool-fact {
            color: darkolivegreen;
            font-style: italic
        }

        </style>
        </head>
        <body>

            <div class="fact-file">
                <h2 class="animal-name">Snow Leopard</h2>
                <p class="detail">Type: Big Cat</p>
                <p class="detail">Lives in: Mountain ranges of central Asia</p>
                <p class="detail">Diet: Deer, goats, and wild sheep</p>
                <p class="cool-fact">Cool-Fact: Can leap up to 15 meters in one jum!</p>
        
        </div>
        </body>
        </html>
